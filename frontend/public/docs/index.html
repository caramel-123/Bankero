<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bankero Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Bankero — Decentralized Credit Scoring &amp; Micro-Lending on Stellar. Full documentation: features, architecture, setup, and implementation.">
  <meta name="theme-color" content="#16a34a">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #16a34a;
    }
    .sidebar-nav li.active > a {
      font-weight: 700;
    }
    .icon {
      width: 16px;
      height: 16px;
      vertical-align: -3px;
      margin-right: 6px;
      flex: none;
    }
    .app-name-link {
      display: inline-flex;
      align-items: center;
    }
    .app-name-link .icon {
      width: 20px;
      height: 20px;
      vertical-align: -4px;
    }
  </style>
</head>
<body>
  <div id="app">Loading Bankero documentation…</div>
  <script>
    window.$docsify = {
      name: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Bankero Docs',
      nameLink: '/docs/',
      repo: 'https://github.com/caramel-123/Bankero',
      homepage: 'https://raw.githubusercontent.com/caramel-123/Bankero/main/README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No results.',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      formatUpdated: '{MM}/{DD}/{YYYY}'
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
